# Source: todo-app/templates/todo-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-todo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo

  template:
    metadata:
      labels:
        app: todo

    spec:
      containers:
        - name: todo
          image: omareltabakh/todo-app:v1.1

          ports:
            - containerPort: 8000

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: test-config
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: test-config
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_PASSWORD

            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: test-config
                  key: MYSQL_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: test-config
                  key: DB_PORT

          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
