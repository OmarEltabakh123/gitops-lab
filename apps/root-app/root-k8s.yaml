apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-k8s
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/OmarEltabakh123/gitops-lab.git
    targetRevision: main
    path: apps/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true