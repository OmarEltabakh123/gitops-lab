apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://github.com/OmarEltabakh123/gitops-lab.git
    targetRevision: main
    path: k8s/mysql

  destination:
    server: https://kubernetes.default.svc
    namespace: todo-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true