apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/OmarEltabakh123/gitops-lab.git
    targetRevision: main
    path: k8s/todo

  destination:
    server: https://kubernetes.default.svc
    namespace: todo-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true