apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-helm
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/OmarEltabakh123/gitops-lab.git
    targetRevision: main
    path: helm/todo-app

  destination:
    server: https://kubernetes.default.svc
    namespace: todo-helm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  
