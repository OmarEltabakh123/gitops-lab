apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-notifier

spec:
  replicas: {{ .Values.notifier.replicaCount }}

  selector:
    matchLabels:
      app: notifier

  template:
    metadata:
      labels:
        app: notifier

    spec:
      containers:
        - name: notifier
          image: {{ .Values.notifier.image }}

          env:
            - name: CHECK_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: CHECK_INTERVAL

            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_HOST

            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PORT

            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PASS

            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_HOST

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_USER

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_DATABASE

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_PASSWORD
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_PORT

            - name: EMAIL_TO
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: EMAIL_TO