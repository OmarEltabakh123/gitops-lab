apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-todo

spec:
  replicas: {{ .Values.todo.replicaCount }}

  selector:
    matchLabels:
      app: todo

  template:
    metadata:
      labels:
        app: todo

    spec:
      containers:
        - name: todo
          image: {{ .Values.todo.image }}

          ports:
            - containerPort: {{ .Values.todo.service.port }}

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets

            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_PORT

          startupProbe:
            tcpSocket:
              port: {{ .Values.todo.service.port }}
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: {{ .Values.todo.service.port }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: {{ .Values.todo.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3