apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ .Values.secret.mysqlPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secret.mysqlRootPassword | quote }}

  SMTP_HOST: {{ .Values.secret.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secret.smtpPort | quote }}
  SMTP_USER: {{ .Values.secret.smtpUser | quote }}
  SMTP_PASS: {{ .Values.secret.smtpPass | quote }}
  EMAIL_TO: {{ .Values.secret.emailTo   | quote }}